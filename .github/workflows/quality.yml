name: Quality

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Reviewed full commit SHA; must equal the dispatched ref
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Validate explicit source
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
          RESOLVED_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if ($env:REPOSITORY -cne 'Asdb24/CV-Manager') { throw 'REPOSITORY_MISMATCH' }
          if ($env:SOURCE_REF -cnotmatch '^refs/heads/codex/[a-z0-9-]+$') { throw 'REVIEWED_WORK_BRANCH_REQUIRED' }
          if ($env:REQUESTED_SHA -cnotmatch '^[0-9a-f]{40}$' -or $env:REQUESTED_SHA -cne $env:RESOLVED_SHA) { throw 'SOURCE_SHA_MISMATCH' }
      - name: Checkout reviewed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Locked Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.8.2
      - name: Locked Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.15
      - name: Locked uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.12.19
          enable-cache: false
      - name: Install frozen development tools
        run: |
          npm.cmd install --global npm@12.0.2 --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup toolchain install 1.98.1-x86_64-pc-windows-msvc --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.98.1-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --frozen --group dev --python 3.13.15
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fetch --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate quality contract and workflow
        run: node scripts/quality-ci.mjs validate --manifest contracts/quality-ci.json
      - name: Format
        run: node scripts/tasks.mjs format:check
      - name: Lint
        run: node scripts/tasks.mjs lint
      - name: Types
        run: node scripts/tasks.mjs typecheck
      - name: Unit and development contract checks
        run: node scripts/tasks.mjs test
